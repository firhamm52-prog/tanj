<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>TANJ — Pembayaran diterima</title>
  </head>
  <body
    style="
      background: #f4f0e9;
      color: #302b26;
      font:
        14px Arial,
        sans-serif;
    "
  >
    <main style="max-width: 580px; margin: 24px auto; background: #fffdf8; padding: 32px">

      <p>Butuh bantuan? Hubungi tanj.indonesia@gmail.com.</p>
